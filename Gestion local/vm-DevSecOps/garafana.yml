---
- name: Installer Grafana
  hosts: vm-devsecops
  become: yes

  tasks:

    - name: Installer dépendances
      apt:
        name:
          - apt-transport-https
          - software-properties-common
        state: present
        update_cache: yes

    - name: Ajouter clé Grafana
      apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present

    - name: Ajouter repo Grafana
      apt_repository:
        repo: "deb https://packages.grafana.com/oss/deb stable main"
        state: present

    - name: Installer Grafana
      apt:
        name: grafana
        state: latest
        update_cache: yes

    - name: Démarrer Grafana
      service:
        name: grafana-server
        state: started
        enabled: yes
