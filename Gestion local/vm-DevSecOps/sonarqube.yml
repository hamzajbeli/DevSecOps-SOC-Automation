---
- name: Installer SonarQube
  hosts: vm-devsecops
  become: yes

  tasks:

    - name: Installer Java
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: yes

    - name: Télécharger SonarQube
      get_url:
        url: https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-9.9.1.69595.zip
        dest: /opt/sonarqube.zip

    - name: Installer unzip
      apt:
        name: unzip
        state: present

    - name: Extraire SonarQube
      unarchive:
        src: /opt/sonarqube.zip
        dest: /opt/
        remote_src: yes

    - name: Lancer SonarQube
      shell: /opt/sonarqube-9.9.1.69595/bin/linux-x86-64/sonar.sh start
